name: Deploy

# Runs on every published release; run it by hand on a release tag to
# redeploy that version (or roll back to it).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/karjona/shifty-race-server

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        name: Version from the tag
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ] || ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Deploy runs on a release tag (vX.Y.Z), not $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  image:
    name: Race server image
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        name: Already published?
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "$IMAGE:$VERSION is already published"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.exists != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.exists.outputs.exists != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: crates/race-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web:
    name: Client build
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show # installs the toolchain pinned in rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: wasm-bindgen CLI version from Cargo.lock
        id: wasm-bindgen
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }},cargo-about@0.9.3
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-dist
          path: apps/client/dist
          if-no-files-found: error
          retention-days: 7

  migrate:
    name: Database migrations
    needs: [image, web]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter lobby db:migrate
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

  lobby:
    name: Lobby and client (Cloudflare)
    needs: [version, image, web, migrate]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client-dist
          path: apps/client/dist
      # Upload, then deploy the version: the custom domain stays as it is
      # (the token can't change it; `wrangler triggers deploy` by hand does).
      - id: upload
        name: Upload the Worker version
        run: |
          pnpm --filter lobby exec wrangler versions upload --message "v$VERSION" | tee upload.log
          id=$(sed -n 's/^Worker Version ID: //p' upload.log)
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Deploy it to all traffic
        env:
          VERSION_ID: ${{ steps.upload.outputs.id }}
        run: pnpm --filter lobby exec wrangler versions deploy "$VERSION_ID@100%" --message "v$VERSION" --yes

  race-server:
    name: Race server (Coolify)
    needs: [version, lobby]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    permissions:
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image is public
        run: |
          repo="${IMAGE#ghcr.io/}"
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:$repo:pull" | jq -r .token) || token=""
          if ! curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/$repo/manifests/$VERSION"; then
            echo "::error::$IMAGE isn't public, so Coolify can't pull it. Set it to public at https://github.com/users/karjona/packages/container/shifty-race-server/settings and re-run this job."
            exit 1
          fi
      - name: Point live at this version
        run: docker buildx imagetools create -t "$IMAGE:live" "$IMAGE:$VERSION"
      - name: Redeploy on Coolify
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail-with-body -sS -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=false"
          echo
      # Coolify lets the old server finish its races (up to 20 min) before the new one starts.
      - name: Wait for the lobby to see it
        run: |
          deadline=$((SECONDS + 25 * 60))
          while true; do
            health=$(curl -fsS https://23.4shifty.gg/api/health || true)
            echo "$(date -u +%H:%M:%S) ${health:-lobby unreachable}"
            if [ -n "$health" ] && echo "$health" | jq -e --arg v "$VERSION" \
              '.version == $v and any(.raceServers[]?; .version == $v and .draining == false)' > /dev/null; then
              echo "race server $VERSION is live"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::no live race server on $VERSION after 25 minutes"
              exit 1
            fi
            sleep 15
          done
