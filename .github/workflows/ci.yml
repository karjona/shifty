name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show # installs the toolchain pinned in rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  web:
    name: Web (determinism, lint, types, build, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm
      - name: Native and WASM sims are bit-identical
        run: pnpm check:determinism 20000
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter client build
      - run: pnpm exec playwright install --with-deps --no-shell chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  race-server-image:
    name: Race server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f crates/race-server/Dockerfile -t shifty-race-server .
      - name: Image boots and reports healthy
        run: |
          docker run -d --name rs -p 4433:4433/udp -p 4433:4433/tcp \
            -e BIND='[::]:4433' -e PUBLIC_ADDR=localhost:4433 \
            -e LOBBY_PUBLIC_KEY=C8eRicBps7bsA6cb8Py-d84vXBFooZvoNBWeD0odyMo \
            shifty-race-server
          for i in $(seq 1 20); do curl -fs localhost:4433/healthz && break; sleep 1; done
          curl -fs localhost:4433/healthz
          docker image ls shifty-race-server --format '{{.Size}}'
          docker logs rs
