name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show # installs the toolchain pinned in rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    name: Rust dependencies (licenses, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check --hide-inclusion-graph

  web:
    name: Web (determinism, lint, types, build, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: wasm-bindgen CLI version from Cargo.lock
        id: wasm-bindgen
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }},cargo-about@0.9.3
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm
      - name: Native and WASM sims are bit-identical
        run: pnpm check:determinism 20000
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter client build
      - run: pnpm exec playwright install --with-deps --no-shell chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  race-server-image:
    name: Race server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f crates/race-server/Dockerfile -t shifty-race-server .
      - name: Image boots and reports healthy
        run: |
          docker run -d --name rs -p 4433:4433/udp -p 4433:4433/tcp \
            -e BIND='[::]:4433' -e PUBLIC_ADDR=localhost:4433 \
            -e LOBBY_PUBLIC_KEY=C8eRicBps7bsA6cb8Py-d84vXBFooZvoNBWeD0odyMo \
            shifty-race-server
          for i in $(seq 1 20); do curl -fs localhost:4433/healthz && break; sleep 1; done
          curl -fs localhost:4433/healthz
          docker image ls shifty-race-server --format '{{.Size}}'
          docker logs rs
      - name: Image ships license notices
        run: |
          docker cp rs:/usr/share/doc/shifty/. notices/
          ls notices/LICENSE notices/NOTICE
          grep -q '^- quinn ' notices/THIRD-PARTY-NOTICES.md
