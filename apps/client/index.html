<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <title>23.4° Shifty</title>
    <meta name="theme-color" content="#f3ede1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Shifty" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/boot.css" />
  </head>
  <body>
    <div id="boot">
      <div class="boot-stack">
        <div class="boot-mark" aria-hidden="true">
          <span class="deg">23.4°</span><span class="axis"></span><span class="name">SHIFTY</span>
        </div>
        <div class="load" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="load-bar"><i class="load-fill"></i></div>
          <div class="load-line"><span class="load-what"></span><span class="load-pct"></span></div>
        </div>
      </div>
      <div class="boot-swipe">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 14l7-7 7 7" /></svg>
        <span></span>
      </div>
    </div>
    <div id="loading" role="status">
      <span class="load-what"></span>
      <div class="load-bar off"><i class="load-fill"></i></div>
    </div>
    <div id="swipe" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M5 14l7-7 7 7" /></svg>
      <span></span>
    </div>
    <div id="rotate" role="alert">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <path class="arc" d="M24 46a40 40 0 0 1 38-30" />
        <path class="arc" d="M58 10l6 6-7 5" />
        <rect class="phone" x="42" y="30" width="36" height="64" rx="7" />
      </svg>
      <span></span>
    </div>
    <div id="app"></div>
    <div id="ui"></div>
    <div id="root"></div>
    <div id="status" hidden></div>
    <div id="help" hidden></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
