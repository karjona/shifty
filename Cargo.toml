[workspace]
resolver = "3"
members = ["crates/sim", "crates/protocol", "crates/client-core", "crates/race-server", "crates/sim-wasm", "crates/devkit"]

[workspace.package]
version = "0.11.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Per-slot parallel arrays read better with an index.
needless_range_loop = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
